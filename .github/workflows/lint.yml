name: Lint Check

# Workflow phụ: kiểm tra TypeScript + lint khi có PR
# Giúp phát hiện lỗi sớm trước khi duyệt

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cài dependencies
        run: npm ci

      - name: Kiểm tra TypeScript
        run: npx tsc --noEmit
        continue-on-error: true  # không chặn PR nếu có warning

      - name: Chạy prebuild
        run: npm run prebuild

      - name: Build thử
        run: npm run build
