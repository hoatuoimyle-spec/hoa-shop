name: Build and Deploy

# Workflow này làm 2 việc:
# 1. Khi có Pull Request: build thử + deploy lên địa chỉ xem trước (preview)
# 2. Khi gộp vào main: build + deploy lên web thật (hoa.qthong0893.io.vn)
#
# Yêu cầu: đặt 2 secrets trong GitHub repo (Settings → Secrets and variables → Actions):
#   - CLOUDFLARE_API_TOKEN   (token Cloudflare, quyền Pages:Edit)
#   - CLOUDFLARE_ACCOUNT_ID  (Account ID của bạn trên Cloudflare)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

# Chỉ cho phép 1 deploy chạy cùng lúc cho mỗi nhánh
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cài dependencies
        run: npm ci

      - name: Chạy prebuild (chép taxonomy.json)
        run: npm run prebuild

      - name: Build Next.js
        run: npm run build
        env:
          # Next.js sẽ xuất HTML tĩnh vào thư mục out/
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Kiểm tra thư mục out/ đã có
        run: |
          if [ ! -d "out" ]; then
            echo "❌ Build thất bại: không thấy thư mục out/"
            exit 1
          fi
          echo "✅ Build thành công. Số file trong out/:"
          find out -type f | wc -l

      - name: Deploy lên Cloudflare Pages (Preview)
        if: github.event_name == 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name hoa-shop --branch ${{ github.head_ref }}

      - name: Deploy lên Cloudflare Pages (Production)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name hoa-shop --branch main

      - name: Thông báo kết quả lên PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = `https://${{ github.head_ref }}.hoa-shop.pages.dev`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ **Build thành công!**\n\n🔗 **Xem trước:** ${previewUrl}\n\nBạn hãy mở link xem trước, kiểm tra kỹ. Nếu ưng thì bấm **Merge pull request** để đưa lên web thật.`
            });
