name: Build and Deploy

# - Có Pull Request (do Hermes mở): build thử + đưa lên địa chỉ XEM TRƯỚC, bot ghi link vào PR.
# - Gộp vào main: build + đưa lên web thật.
# Cần 2 secrets trong GitHub: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
#
# Thiết kế an toàn: bước build (chạy code của PR) KHÔNG có secrets.
# Bước deploy (có secrets) chỉ nhận thư mục `out` đã build, không chạy npm install, không chạy script của PR.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy
    needs: build
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out
      - name: Đưa lên Cloudflare Pages
        id: cf
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: pages deploy out --project-name=hoa-shop --branch=${{ github.event_name == 'push' && 'main' || format('pr-{0}', github.event.pull_request.number) }} --commit-dirty=true
      - name: Ghi link xem trước vào PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          ALIAS_URL: ${{ steps.cf.outputs.pages-deployment-alias-url }}
          DEPLOY_URL: ${{ steps.cf.outputs.deployment-url }}
        with:
          script: |
            const url = process.env.ALIAS_URL || process.env.DEPLOY_URL || '(không lấy được link, xem trong Cloudflare → Deployments)';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Build thành công.\n\nLink xem trước: ${url}\n\nLưu ý: bản xem trước dùng chung database với web thật, nên đừng đặt đơn thử ở đây. Xem kỹ tab "Files changed" rồi mới bấm Merge.`
            });
